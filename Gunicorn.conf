# Settings for gunicorn, the web server Render uses to run VeraDose.
# gunicorn reads this file automatically from the project folder; no Render changes needed.
#
# Why: by default gunicorn handles ONE request at a time and kills itself if a request
# takes over 30 seconds. A slow database wake-up could then freeze or crash the whole site.
# With threads, one slow request no longer blocks everything else.

workers = 1          # keep 1: caregiver alerts run inside the app and must not be sent twice
threads = 8          # handle up to 8 requests at the same time
timeout = 120        # give slow requests (database waking up, AI replies) time to finish
graceful_timeout = 30
keepalive = 5