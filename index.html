<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSnap: Smart Medication Manager</title>
    <script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('medsnap_theme') || 'light'); } catch (e) {}</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Palette: #8BA49A sage, #CBDED3 mint, #3B6255 forest, #D2C49E sand */
        :root {
            --sage: #8BA49A; --mint: #CBDED3; --forest: #3B6255; --sand: #D2C49E;
            --ink: #1F3A30; --ink-soft: #3B6255;
            --bg-main: #CBDED3;
            --bg-glow: radial-gradient(at 8% 8%, rgba(139,164,154,.45) 0, transparent 50%), radial-gradient(at 92% 92%, rgba(210,196,158,.45) 0, transparent 50%);
            --surface: rgba(255,255,255,.62); --surface-solid: #F3F8F5; --border: rgba(59,98,85,.22);
            --sidebar-bg: #3B6255; --sidebar-text: #CBDED3; --sidebar-active: rgba(203,222,211,.18);
            --btn-bg: #3B6255; --btn-text: #ffffff; --btn-hover: #2D4D42;
            --btn2-bg: #D2C49E; --btn2-text: #1F3A30;
            --ok-bg: #8BA49A; --ok-text: #10241c;
            --warn-bg: #D2C49E; --warn-text: #3A3216;
            --danger: #9F3A28; --danger-bg: rgba(159,58,40,.12);
            --input-bg: rgba(255,255,255,.8); --shadow: 0 6px 24px rgba(31,58,48,.10);
        }
        [data-theme="dark"] {
            --ink: #CBDED3; --ink-soft: #8BA49A;
            --bg-main: #101C17;
            --bg-glow: radial-gradient(at 8% 8%, rgba(59,98,85,.5) 0, transparent 50%), radial-gradient(at 92% 92%, rgba(210,196,158,.12) 0, transparent 50%);
            --surface: rgba(59,98,85,.26); --surface-solid: #18291f; --border: rgba(203,222,211,.16);
            --sidebar-bg: #0B1411; --sidebar-text: #CBDED3; --sidebar-active: rgba(139,164,154,.22);
            --btn-bg: #8BA49A; --btn-text: #10241c; --btn-hover: #A6BBB2;
            --btn2-bg: #D2C49E; --btn2-text: #1F3A30;
            --ok-bg: #3B6255; --ok-text: #CBDED3;
            --warn-bg: rgba(210,196,158,.2); --warn-text: #D2C49E;
            --danger: #F0A08E; --danger-bg: rgba(240,160,142,.14);
            --input-bg: rgba(0,0,0,.25); --shadow: 0 6px 24px rgba(0,0,0,.35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
        body { background: var(--bg-glow), var(--bg-main); color: var(--ink); display: flex; min-height: 100vh; transition: background-color .3s, color .3s; }
        a { color: inherit; }
        h1 { font-size: 1.8rem; margin-bottom: 6px; }
        h3 { margin-bottom: 4px; }
        .sidebar { width: 270px; flex-shrink: 0; background: var(--sidebar-bg); color: var(--sidebar-text); padding: 24px 18px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: 800; text-decoration: none; color: var(--sidebar-text); }
        .brand-sub { font-size: .82rem; opacity: .8; margin-top: -8px; }
        .nav-list { list-style: none; }
        .nav-item { padding: 11px 14px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; margin-bottom: 4px; transition: .2s; border-left: 3px solid transparent; }
        .nav-item i { width: 18px; text-align: center; }
        .nav-item:hover, .nav-item.active { background: var(--sidebar-active); font-weight: 600; }
        .nav-item.active { border-left-color: var(--sand); }
        .nav-item:focus-visible { outline: 2px solid var(--sand); }
        .sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        .side-btn { background: transparent; color: var(--sidebar-text); border: 1px solid rgba(203,222,211,.4); padding: 9px 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: .9rem; }
        .side-btn:hover { background: var(--sidebar-active); }
        .main-content { flex-grow: 1; min-width: 0; padding: 32px 40px 48px; max-width: 1150px; }
        .page-view { display: none; }
        .page-view.active { display: block; }
        .sub { color: var(--ink-soft); margin-bottom: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 26px; background: var(--surface); padding: 12px 18px; border-radius: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); backdrop-filter: blur(12px); }
        .top-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-bottom: 18px; box-shadow: var(--shadow); backdrop-filter: blur(12px); }
        .btn { background: var(--btn-bg); color: var(--btn-text); border: none; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: .2s; font-size: .95rem; }
        .btn:hover { background: var(--btn-hover); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn:focus-visible, .input:focus-visible, .chip input:focus-visible + span { outline: 2px solid var(--forest); outline-offset: 2px; }
        [data-theme="dark"] .btn:focus-visible, [data-theme="dark"] .input:focus-visible { outline-color: var(--sand); }
        .btn-sand { background: var(--btn2-bg); color: var(--btn2-text); }
        .btn-sand:hover { background: #C4B58A; }
        .btn-small { padding: 6px 12px; font-size: .85rem; }
        .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .input { width: 100%; padding: 11px 12px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--ink); margin-bottom: 14px; font-size: .95rem; }
        .input option { background: var(--surface-solid); color: var(--ink); }
        select.input.inline { width: auto; margin: 0; padding: 7px 10px; }
        label, .label { display: block; margin-bottom: 6px; color: var(--ink-soft); font-size: .9rem; font-weight: 600; }
        .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 20px; font-size: .8rem; font-weight: 700; }
        .badge-ok { background: var(--ok-bg); color: var(--ok-text); }
        .badge-warn { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--sand); }
        .badge-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
        .streak { background: var(--sand); color: #3A3216; font-size: .95rem; padding: 6px 14px; }
        .tag { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-solid); border: 1px solid var(--border); color: var(--ink); padding: 3px 10px; border-radius: 16px; font-size: .78rem; font-weight: 600; margin: 4px 6px 0 0; }
        .med-item { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 14px; background: var(--surface-solid); border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
        .med-main { display: flex; gap: 14px; align-items: center; min-width: 0; flex: 1 1 280px; }
        .med-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .med-name { font-size: 1.05rem; }
        .med-note { font-size: .85rem; color: var(--ink-soft); margin-top: 4px; }
        .muted { color: var(--ink-soft); }
        .banner { border-left: 5px solid var(--sand); }
        .banner.danger { border-left-color: var(--danger); }
        .result-box { background: var(--surface-solid); padding: 14px; border-radius: 10px; border-left: 4px solid var(--forest); white-space: pre-wrap; line-height: 1.6; text-align: left; }
        .disclaimer { font-size: .8rem; color: var(--ink-soft); margin-top: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .chip input { position: absolute; opacity: 0; pointer-events: none; }
        .chip span { display: inline-block; padding: 7px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--input-bg); cursor: pointer; font-size: .85rem; font-weight: 600; user-select: none; }
        .chip input:checked + span { background: var(--forest); color: #fff; border-color: var(--forest); }
        [data-theme="dark"] .chip input:checked + span { background: var(--sage); color: #10241c; border-color: var(--sage); }
        .check-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; font-weight: 500; color: var(--ink); }
        .check-row input { margin-top: 4px; accent-color: var(--forest); }
        .pill-preview { width: 84px; height: 84px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--surface-solid); border: 1px solid var(--border); border-radius: 14px; }
        .pill-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .pill-tile { text-align: center; background: var(--surface-solid); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
        .bar { height: 8px; background: var(--border); border-radius: 6px; overflow: hidden; margin-top: 8px; }
        .bar > div { height: 100%; background: var(--forest); border-radius: 6px; }
        [data-theme="dark"] .bar > div { background: var(--sage); }
        .bar.low > div { background: var(--sand); }
        .chat-box { background: var(--surface-solid); border: 1px solid var(--border); border-radius: 12px; padding: 16px; height: 340px; overflow-y: auto; margin-bottom: 12px; }
        .chat-msg { margin-bottom: 12px; line-height: 1.55; white-space: pre-wrap; }
        .chat-row { display: flex; gap: 8px; }
        .chat-row .input { margin-bottom: 0; }
        .mic-on { background: var(--danger) !important; color: #fff !important; }
        #toast { position: fixed; bottom: 22px; right: 22px; max-width: 330px; padding: 13px 17px; border-radius: 12px; background: var(--surface-solid); color: var(--ink); border: 1px solid var(--border); box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: .25s; pointer-events: none; z-index: 50; }
        #toast.show { opacity: 1; transform: translateY(0); }
        #toast.error { border-color: var(--danger); }
        #toast.ok { border-color: var(--forest); }
        @media (max-width: 860px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: static; padding: 14px; gap: 10px; }
            .nav-list { display: flex; flex-wrap: wrap; gap: 6px; }
            .nav-item { margin-bottom: 0; padding: 8px 12px; font-size: .88rem; border-left: none; }
            .sidebar-foot { flex-direction: row; flex-wrap: wrap; margin-top: 0; }
            .main-content { padding: 20px 16px 40px; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <a class="brand" href="/"><i class="fa-solid fa-capsules"></i> MedSnap</a>
        <p class="brand-sub" data-i18n="sidebar_tag">Smart Medication Manager</p>
        <ul class="nav-list" role="tablist">
            <li class="nav-item active" tabindex="0" data-page="schedule-page"><i class="fa-solid fa-calendar-day"></i> <span data-i18n="nav_schedule">Today's Schedule</span></li>
            <li class="nav-item" tabindex="0" data-page="add-page"><i class="fa-solid fa-circle-plus"></i> <span data-i18n="nav_add">Add Medication</span></li>
            <li class="nav-item" tabindex="0" data-page="scanner-page"><i class="fa-solid fa-camera"></i> <span data-i18n="nav_scanner">Scan Bottle Label</span></li>
            <li class="nav-item" tabindex="0" data-page="inventory-page"><i class="fa-solid fa-pills"></i> <span data-i18n="nav_inventory">Inventory & Refills</span></li>
            <li class="nav-item" tabindex="0" data-page="visualizer-page"><i class="fa-solid fa-magnifying-glass"></i> <span data-i18n="nav_visualizer">Pill Visualizer</span></li>
            <li class="nav-item" tabindex="0" data-page="caregiver-page"><i class="fa-solid fa-bell"></i> <span data-i18n="nav_caregiver">Caregiver Alerts</span></li>
            <li class="nav-item" tabindex="0" data-page="safety-page"><i class="fa-solid fa-shield-heart"></i> <span data-i18n="nav_safety">Interaction Checker</span></li>
            <li class="nav-item" tabindex="0" data-page="assistant-page"><i class="fa-solid fa-comments"></i> <span data-i18n="nav_assistant">Ask MedSnap AI</span></li>
        </ul>
        <div class="sidebar-foot">
            <button type="button" class="side-btn" id="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="theme-icon"></i> <span id="theme-text"></span></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <div class="top-group">
                <span class="badge streak" id="streak-badge">🔥</span>
                <span class="badge badge-warn" id="progress-badge"><i class="fa-solid fa-circle-check"></i> <span id="progress-text"></span></span>
            </div>
            <div class="top-group">
                <button class="btn btn-sand btn-small" onclick="speakAll()"><i class="fa-solid fa-volume-high"></i> <span data-i18n="read_all">Read schedule aloud</span></button>
                <button class="btn btn-small btn-danger" onclick="stopSpeaking()" data-i18n-aria="stop_audio" aria-label="Stop"><i class="fa-solid fa-stop"></i></button>
                <select class="input inline" id="lang-select" onchange="setLanguage(this.value)" aria-label="Language">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="zh">中文</option>
                </select>
            </div>
        </div>

        <!-- Schedule -->
        <section id="schedule-page" class="page-view active">
            <h1 data-i18n="sched_title">Today's Prescription Schedule</h1>
            <p class="sub" data-i18n="sched_sub"></p>
            <div id="pending-banner" class="card banner" style="display:none;">
                <h3><i class="fa-solid fa-hourglass-half"></i> <span data-i18n="pending_title"></span></h3>
                <p class="muted" data-i18n="pending_text"></p>
            </div>
            <div id="low-banner" class="card banner danger" style="display:none;">
                <h3 style="color: var(--danger);"><i class="fa-solid fa-triangle-exclamation"></i> <span data-i18n="low_title"></span></h3>
                <p class="muted" id="low-text"></p>
            </div>
            <div class="card"><h3>☀️ <span data-i18n="morning"></span></h3><div id="list-Morning" style="margin-top:12px;"></div></div>
            <div class="card"><h3>🌤️ <span data-i18n="afternoon"></span></h3><div id="list-Afternoon" style="margin-top:12px;"></div></div>
            <div class="card"><h3>🌙 <span data-i18n="evening"></span></h3><div id="list-Evening" style="margin-top:12px;"></div></div>
        </section>

        <!-- Add medication -->
        <section id="add-page" class="page-view">
            <h1 data-i18n="add_title"></h1>
            <p class="sub" data-i18n="add_sub"></p>
            <div class="card" style="max-width: 680px;">
                <form id="add-med-form" onsubmit="submitMedication(event)">
                    <label for="med-name" data-i18n="f_name"></label>
                    <input type="text" id="med-name" class="input" maxlength="120" required data-i18n-ph="ph_name">
                    <div class="grid-2">
                        <div><label for="med-dosage" data-i18n="f_dosage"></label><input type="text" id="med-dosage" class="input" maxlength="60" required data-i18n-ph="ph_dosage"></div>
                        <div><label for="med-slot" data-i18n="f_slot"></label>
                            <select id="med-slot" class="input" onchange="onSlotChange()">
                                <option value="Morning" data-i18n="morning"></option>
                                <option value="Afternoon" data-i18n="afternoon"></option>
                                <option value="Evening" data-i18n="evening"></option>
                            </select></div>
                    </div>
                    <div class="grid-2">
                        <div><label for="med-time" data-i18n="f_time"></label><input type="time" id="med-time" class="input" value="08:00" required></div>
                        <div><label for="med-daily" data-i18n="f_daily"></label><input type="number" id="med-daily" class="input" value="1" min="1" max="20" required></div>
                    </div>
                    <label for="med-stock" data-i18n="f_stock"></label>
                    <input type="number" id="med-stock" class="input" value="30" min="0" max="10000" required>
                    <div class="label" data-i18n="f_badges"></div>
                    <div class="chips" id="badge-chips"></div>
                    <label for="med-food" data-i18n="f_food"></label>
                    <input type="text" id="med-food" class="input" maxlength="200" data-i18n-ph="ph_food">
                    <div class="label" data-i18n="f_pill"></div>
                    <div style="display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap;">
                        <div class="pill-preview" id="add-preview"></div>
                        <div style="flex:1 1 320px;">
                            <div class="grid-2">
                                <div><label for="med-shape" data-i18n="f_shape"></label><select id="med-shape" class="input" onchange="updateAddPreview()"></select></div>
                                <div><label for="med-color" data-i18n="f_color"></label><select id="med-color" class="input" onchange="updateAddPreview()"></select></div>
                            </div>
                            <label for="med-imprint" data-i18n="f_imprint"></label>
                            <input type="text" id="med-imprint" class="input" maxlength="12" oninput="updateAddPreview()" data-i18n-ph="ph_imprint">
                        </div>
                    </div>
                    <label class="check-row"><input type="checkbox" id="med-critical"> <span data-i18n="f_critical"></span></label>
                    <button type="submit" class="btn" id="save-med-btn" data-i18n="save_med"></button>
                </form>
            </div>
        </section>

        <!-- Scanner -->
        <section id="scanner-page" class="page-view">
            <h1 data-i18n="scan_title"></h1>
            <p class="sub" data-i18n="scan_sub"></p>
            <div class="card" style="max-width: 640px; text-align:center; border: 2px dashed var(--sage);">
                <input type="file" id="bottle-upload" accept="image/*" style="display:none;" onchange="handleBottleUpload(event)">
                <button class="btn" onclick="document.getElementById('bottle-upload').click()"><i class="fa-solid fa-upload"></i> <span data-i18n="scan_upload"></span></button>
                <div id="scanner-results" class="muted" style="margin-top:15px;" data-i18n="scan_waiting"></div>
            </div>
            <p class="disclaimer" style="max-width:640px;" data-i18n="scan_warning"></p>
        </section>

        <!-- Inventory -->
        <section id="inventory-page" class="page-view">
            <h1 data-i18n="inv_title"></h1>
            <p class="sub" data-i18n="inv_sub"></p>
            <div class="card" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                <span class="label" style="margin:0;" data-i18n="inv_threshold"></span>
                <select id="threshold-select" class="input inline" onchange="setThreshold(this.value)">
                    <option value="5">5</option><option value="6">6</option><option value="7">7</option>
                </select>
                <span class="muted" data-i18n="days_word"></span>
            </div>
            <div class="card"><div id="inventory-list"></div></div>
        </section>

        <!-- Pill visualizer -->
        <section id="visualizer-page" class="page-view">
            <h1 data-i18n="vis_title"></h1>
            <p class="sub" data-i18n="vis_sub"></p>
            <div class="card" style="max-width: 680px;">
                <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start;">
                    <div>
                        <div class="label" data-i18n="vis_preview"></div>
                        <div class="pill-preview" id="vis-preview" style="width:120px; height:120px;"></div>
                    </div>
                    <div style="flex:1 1 300px;">
                        <div class="grid-2">
                            <div><label for="vis-shape" data-i18n="f_shape"></label><select id="vis-shape" class="input" onchange="updateVisPreview()"></select></div>
                            <div><label for="vis-color" data-i18n="f_color"></label><select id="vis-color" class="input" onchange="updateVisPreview()"></select></div>
                        </div>
                        <label for="vis-imprint" data-i18n="f_imprint"></label>
                        <input type="text" id="vis-imprint" class="input" maxlength="12" oninput="updateVisPreview()" data-i18n-ph="ph_imprint">
                        <button class="btn" onclick="checkPill()" data-i18n="vis_check"></button>
                    </div>
                </div>
                <div id="vis-result" style="margin-top:16px; font-weight:600; line-height:1.6;"></div>
                <p class="disclaimer" data-i18n="vis_disclaimer"></p>
            </div>
            <h3 style="margin: 8px 0 12px;" data-i18n="vis_mine"></h3>
            <div class="pill-gallery" id="vis-gallery"></div>
        </section>

        <!-- Caregiver -->
        <section id="caregiver-page" class="page-view">
            <h1 data-i18n="cg_title"></h1>
            <p class="sub" data-i18n="cg_sub"></p>
            <div class="card" style="max-width: 680px;">
                <label class="check-row"><input type="checkbox" id="cg-enabled"> <span data-i18n="cg_enable"></span></label>
                <div class="grid-2">
                    <div><label for="cg-patient" data-i18n="cg_yourname"></label><input type="text" id="cg-patient" class="input" maxlength="60"></div>
                    <div><label for="cg-name" data-i18n="cg_name"></label><input type="text" id="cg-name" class="input" maxlength="60"></div>
                </div>
                <div class="grid-2">
                    <div><label for="cg-email" data-i18n="cg_email"></label><input type="email" id="cg-email" class="input" maxlength="254"></div>
                    <div><label for="cg-phone" data-i18n="cg_phone"></label><input type="tel" id="cg-phone" class="input" maxlength="30" placeholder="+14155550123"></div>
                </div>
                <label class="check-row"><input type="checkbox" id="cg-consent"> <span data-i18n="cg_consent"></span></label>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button class="btn" onclick="saveCaregiver()" data-i18n="cg_save"></button>
                    <button class="btn btn-sand" onclick="testCaregiver()" data-i18n="cg_test"></button>
                </div>
                <div id="cg-status" style="margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;"></div>
                <p class="disclaimer" data-i18n="cg_note"></p>
            </div>
        </section>

        <!-- Safety -->
        <section id="safety-page" class="page-view">
            <h1 data-i18n="safe_title"></h1>
            <p class="sub" data-i18n="safe_sub"></p>

    const LANG_CODES = { en: 'en-US', es: 'es-ES', fr: 'fr-FR', zh: 'zh-CN' };
    const BADGE_KEYS = ['with_food', 'empty_stomach', 'avoid_dairy', 'avoid_alcohol', 'avoid_grapefruit', 'before_bed', 'with_water'];
    const BADGE_ICONS = { with_food: '🍽️', empty_stomach: '⏳', avoid_dairy: '🥛', avoid_alcohol: '🍷', avoid_grapefruit: '🍊', before_bed: '🌙', with_water: '💧' };
    const SHAPE_KEYS = ['round', 'oval', 'capsule', 'oblong', 'square', 'diamond', 'triangle', 'hexagon'];
    const COLOR_KEYS = ['white', 'yellow', 'orange', 'pink', 'red', 'brown', 'green', 'blue', 'purple', 'gray'];
    const COLOR_HEX = { white: '#F4F4F0', yellow: '#F2D544', orange: '#F29B38', pink: '#F4A6C6', red: '#D63E3E', brown: '#8A5A33', green: '#4CAF6A', blue: '#4A86D8', purple: '#8A6BD1', gray: '#A0A6AA' };
    const SLOT_DEFAULT_TIME = { Morning: '08:00', Afternoon: '13:00', Evening: '20:00' };

    /* ====================================================================
       State + helpers
    ==================================================================== */
    let lang = 'en';
    let S = { meds: [], streak: 0, best: 0, caregiver: {}, alerts: { email: false, sms: false } };
    let transCache = {};          // transCache[lang][originalText] = translated text
    let lastScan = null;
    let chatHistory = [];
    let caregiverFormLoaded = false;
    let warnedNoVoice = false;

    function t(key, vars) {
        let s = (I18N[lang] && I18N[lang][key]);
        if (s === undefined) s = I18N.en[key];
        if (s === undefined) s = key;
        if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
        return s;
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    let toastTimer;
    function showToast(message, type) {
        const el = document.getElementById('toast');
        el.textContent = message;
        el.className = 'show ' + (type || '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.className = ''; }, 3800);
    }

    function getClientId() {
        try {
            let id = localStorage.getItem('medsnap_client_id');
            if (!id) {
                const raw = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + Math.random().toString(36).slice(2));
                id = String(raw).replace(/[^A-Za-z0-9_-]/g, '');
                localStorage.setItem('medsnap_client_id', id);
            }
            return id;
        } catch (e) {
            window.__fallbackId = window.__fallbackId || ('anon' + Math.random().toString(36).slice(2, 12));
            return window.__fallbackId;
        }
    }

    function getTimezone() {
        try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { return 'UTC'; }
    }

    async function api(path, options) {
        options = options || {};
        const headers = Object.assign({ 'X-Client-Id': getClientId(), 'X-Timezone': getTimezone() }, options.headers || {});
        const res = await fetch(path, Object.assign({}, options, { headers }));
        let data = null;
        try { data = await res.json(); } catch (e) { /* not JSON */ }
        if (!res.ok || !data || data.success === false) {
            throw new Error((data && data.error) || (t('err_server') + ' (' + res.status + ')'));
        }
        return data;
    }

    function jsonOptions(method, body) {
        return { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    }

    function applyState(data) {
        S.meds = data.medications || [];
        S.streak = data.streak || 0;
        S.best = data.best_streak || 0;
        S.caregiver = data.caregiver || {};
        S.alerts = data.alerts_available || { email: false, sms: false };
        renderAll();
        ensureTranslations();
    }

    async function refresh() {
        try {
            applyState(await api('/api/state'));
        } catch (e) {
            console.error(e);
            const msg = `<p style="color: var(--danger);">${escapeHtml(t('err_server'))} <a href="#" onclick="refresh(); return false;">${escapeHtml(t('try_again'))}</a></p>`;
            ['Morning', 'Afternoon', 'Evening'].forEach(s => { document.getElementById('list-' + s).innerHTML = msg; });
            document.getElementById('inventory-list').innerHTML = msg;
        }
    }

    /* ====================================================================
       Language + theme
    ==================================================================== */
    function applyStaticTranslations() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
        document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
        document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
        updateThemeButton();
        renderBadgeChips();
        fillSelect('med-shape', SHAPE_KEYS, 's_');
        fillSelect('med-color', COLOR_KEYS, 'c_');
        fillSelect('vis-shape', SHAPE_KEYS, 's_');
        fillSelect('vis-color', COLOR_KEYS, 'c_');
        renderChatWelcome();
    }

    function setLanguage(code) {
        if (!I18N[code]) code = 'en';
        lang = code;
        try { localStorage.setItem('medsnap_lang', code); } catch (e) {}
        document.getElementById('lang-select').value = code;
        applyStaticTranslations();
        renderAll();
        ensureTranslations();
        if (window.speechSynthesis) speechSynthesis.cancel();
    }

    function updateThemeButton() {
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.getElementById('theme-icon').className = dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        // Button offers the *other* mode
        document.getElementById('theme-text').textContent = dark ? t('theme_light') : t('theme_dark');
    }

    function toggleTheme() {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('medsnap_theme', next); } catch (e) {}
        updateThemeButton();
    }

    // Translate free-text instructions (e.g. "Take with your largest meal") through the server.
    async function ensureTranslations() {
        if (lang === 'en') return;
        const cache = (transCache[lang] = transCache[lang] || {});
        const missing = [...new Set(S.meds.map(m => m.food_guide).filter(x => x && !(x in cache)))];
        if (!missing.length) return;
        const requestLang = lang;
        try {
            const data = await api('/api/translate', jsonOptions('POST', { language: requestLang, texts: missing }));
            Object.assign(transCache[requestLang], data.translations || {});
            if (lang === requestLang) renderSchedule();
        } catch (e) { /* keep the original text */ }
    }

    function instrText(m) {
        const txt = m.food_guide || '';
        if (lang !== 'en' && transCache[lang] && transCache[lang][txt]) return transCache[lang][txt];
        return txt;
    }

    /* ====================================================================
       Navigation
    ==================================================================== */
    function switchPage(pageId) {
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === pageId));
        document.getElementById(pageId).classList.add('active');
        window.scrollTo(0, 0);
    }
    document.querySelectorAll('.nav-item').forEach(n => {
        n.addEventListener('click', () => switchPage(n.dataset.page));
        n.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); switchPage(n.dataset.page); } });
    });

    /* ====================================================================
       Pill drawing
    ==================================================================== */
    function textColorFor(hex) {
        const n = parseInt(hex.slice(1), 16);
        const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255));
        return lum > 150 ? '#1F2A25' : '#FFFFFF';
    }

    function pillSvg(shape, color, imprint, size) {
        size = size || 56;
        if (!shape && !color) {
            return `<span style="font-size:${Math.round(size * 0.6)}px; line-height:1;" aria-hidden="true">💊</span>`;
        }
        const fill = COLOR_HEX[color] || '#E4E4DF';
        const stroke = 'rgba(0,0,0,.35)';
        let body;
        switch (shape) {
            case 'oval': body = `<ellipse cx="50" cy="50" rx="43" ry="28" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`; break;
            case 'capsule': body = `<rect x="6" y="28" width="88" height="44" rx="22" fill="${fill}" stroke="${stroke}" stroke-width="3"/><line x1="50" y1="28" x2="50" y2="72" stroke="${stroke}" stroke-width="2"/>`; break;
            case 'oblong': body = `<rect x="6" y="30" width="88" height="40" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`; break;
            case 'square': body = `<rect x="16" y="16" width="68" height="68" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`; break;
            case 'diamond': body = `<polygon points="50,8 92,50 50,92 8,50" fill="${fill}" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"/>`; break;
            case 'triangle': body = `<polygon points="50,10 92,84 8,84" fill="${fill}" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"/>`; break;
            case 'hexagon': body = `<polygon points="50,8 88,29 88,71 50,92 12,71 12,29" fill="${fill}" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"/>`; break;
            default: body = `<circle cx="50" cy="50" r="40" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`;
        }
        const label = (imprint || '').slice(0, 8);
        const fontSize = label.length > 5 ? 11 : 14;
        const text = label ? `<text x="50" y="${50 + fontSize / 3}" text-anchor="middle" font-size="${fontSize}" font-weight="700" fill="${textColorFor(fill)}" font-family="system-ui, sans-serif">${escapeHtml(label)}</text>` : '';
        return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="${escapeHtml([shape, color, imprint].filter(Boolean).join(' '))}">${body}${text}</svg>`;
    }

    function fillSelect(id, keys, prefix) {
        const sel = document.getElementById(id);
        const previous = sel.value;
        sel.innerHTML = `<option value="">${escapeHtml(t('any_opt'))}</option>` +
            keys.map(k => `<option value="${k}">${escapeHtml(t(prefix + k))}</option>`).join('');
        sel.value = previous || '';
    }

    function renderBadgeChips() {
        const box = document.getElementById('badge-chips');
        const checked = new Set([...box.querySelectorAll('input:checked')].map(i => i.value));
        box.innerHTML = BADGE_KEYS.map(k => `
            <label class="chip"><input type="checkbox" value="${k}" ${checked.has(k) ? 'checked' : ''}>
            <span>${BADGE_ICONS[k]} ${escapeHtml(t('b_' + k))}</span></label>`).join('');
    }

    /* ====================================================================
       Rendering
    ==================================================================== */
    function renderAll() {
        renderTopbar();
        renderSchedule();
        renderInventory();
        renderGallery();
        renderCaregiver();
    }

    function renderTopbar() {
        const taken = S.meds.filter(m => m.taken).length;
        document.getElementById('progress-text').textContent = t('progress', { taken, total: S.meds.length });
        const pb = document.getElementById('progress-badge');
        pb.className = 'badge ' + (S.meds.length > 0 && taken === S.meds.length ? 'badge-ok' : 'badge-warn');
        const sb = document.getElementById('streak-badge');
        sb.textContent = S.streak > 0 ? t('streak_n', { n: S.streak }) + (S.best > S.streak ? '  ·  ' + t('streak_best', { n: S.best }) : '') : t('streak_start');
    }

    function isOverdue(m) {
        if (m.taken || !/^\d{2}:\d{2}$/.test(m.scheduled_time || '')) return false;
        const [h, mi] = m.scheduled_time.split(':').map(Number);
        const now = new Date();
        return now.getHours() * 60 + now.getMinutes() > h * 60 + mi;
    }

    function daysLeft(m) { return m.stock / Math.max(1, m.daily_dose); }
    function threshold() { try { return parseInt(localStorage.getItem('medsnap_threshold'), 10) || 7; } catch (e) { return 7; } }

    function medCard(m) {
        const badges = (m.badges || []).map(k => `<span class="tag">${BADGE_ICONS[k] || ''} ${escapeHtml(t('b_' + k))}</span>`).join('');
        const instr = instrText(m);
        const status = m.taken ? `<span class="badge badge-ok">${escapeHtml(t('taken'))}</span>`
            : (isOverdue(m) ? `<span class="badge badge-danger">${escapeHtml(t('overdue'))}</span>` : `<span class="badge badge-warn">${escapeHtml(t('pending'))}</span>`);
        const critical = m.critical ? `<span class="badge badge-danger" title="${escapeHtml(t('f_critical'))}">⚠️ ${escapeHtml(t('critical_tag'))}</span>` : '';
        const notified = m.alerted ? `<span class="badge badge-danger">🔔 ${escapeHtml(t('notified'))}</span>` : '';
        return `
        <div class="med-item">
            <div class="med-main">
                <div class="pill-preview" style="width:64px;height:64px;">${pillSvg(m.pill && m.pill.shape, m.pill && m.pill.color, m.pill && m.pill.imprint, 48)}</div>
                <div style="min-width:0;">
                    <div class="med-name"><b>${escapeHtml(m.name)}</b> (${escapeHtml(m.dosage)}) <span class="muted">· ${escapeHtml(t('at_time', { time: m.scheduled_time }))}</span></div>
                    <div>${badges}</div>
                    ${instr ? `<div class="med-note">🍽️ ${escapeHtml(instr)}</div>` : ''}
                </div>
            </div>
            <div class="med-actions">
                ${critical}${notified}${status}
                <button class="btn btn-sand btn-small" onclick="speakMed(${Number(m.id)})" aria-label="${escapeHtml(t('listen'))}: ${escapeHtml(m.name)}"><i class="fa-solid fa-volume-high"></i> ${escapeHtml(t('listen'))}</button>
                <button class="btn btn-small" onclick="toggleTaken(${Number(m.id)})">${escapeHtml(m.taken ? t('undo') : t('mark_taken'))}</button>
                <button class="btn btn-danger btn-small" onclick="deleteMedication(${Number(m.id)})" aria-label="${escapeHtml(t('delete_med'))}: ${escapeHtml(m.name)}"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>`;
    }

    function renderSchedule() {
        ['Morning', 'Afternoon', 'Evening'].forEach(slot => {
            const box = document.getElementById('list-' + slot);
            const meds = S.meds.filter(m => m.slot === slot).sort((a, b) => (a.scheduled_time || '').localeCompare(b.scheduled_time || ''));
            box.innerHTML = meds.length ? meds.map(medCard).join('') : `<p class="muted">${escapeHtml(t('no_meds'))}</p>`;
        });
        document.getElementById('pending-banner').style.display = S.meds.some(m => !m.taken) ? 'block' : 'none';
        const low = S.meds.filter(m => daysLeft(m) <= threshold());
        document.getElementById('low-banner').style.display = low.length ? 'block' : 'none';
        document.getElementById('low-text').textContent = t('low_text', { names: low.map(m => m.name).join(', ') });
    }

    function renderInventory() {
        const sel = document.getElementById('threshold-select');
        if (sel) sel.value = String(threshold());
        const box = document.getElementById('inventory-list');
        if (!S.meds.length) { box.innerHTML = `<p class="muted">${escapeHtml(t('no_meds'))}</p>`; return; }
        box.innerHTML = S.meds.map(m => {
            const days = daysLeft(m);
            const out = m.stock <= 0;
            const low = days <= threshold();
            const badge = out ? `<span class="badge badge-danger">⚠️ ${escapeHtml(t('inv_out'))}</span>`
                : low ? `<span class="badge badge-warn">⚠️ ${escapeHtml(t('inv_low'))}</span>`
                : `<span class="badge badge-ok">${escapeHtml(t('inv_ok'))}</span>`;
            const pct = Math.max(2, Math.min(100, (days / 30) * 100));
            return `
            <div class="med-item" style="display:block;">
                <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
                    <div><b>${escapeHtml(m.name)}</b> <span class="muted">(${escapeHtml(m.dosage)})</span><br>
                        <span class="muted">${escapeHtml(t('inv_left', { n: m.stock, days: days.toFixed(1) }))}</span></div>
                    <div>${badge}</div>
                </div>
                <div class="bar ${low || out ? 'low' : ''}"><div style="width:${pct}%"></div></div>
                <div style="display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap;">
                    <input type="number" class="input" style="width:110px; margin:0;" id="refill-${Number(m.id)}" value="30" min="1" max="10000" aria-label="${escapeHtml(t('refill_amount'))}">
                    <button class="btn btn-sand btn-small" onclick="refillMed(${Number(m.id)})">${escapeHtml(t('refill_btn'))}</button>
                </div>
            </div>`;
        }).join('');
    }

    function renderGallery() {
        const box = document.getElementById('vis-gallery');
        box.innerHTML = S.meds.map(m => {
            const p = m.pill || {};
            const has = p.shape || p.color || p.imprint;
            const desc = has ? [p.color ? t('c_' + p.color) : '', p.shape ? t('s_' + p.shape) : '', p.imprint || ''].filter(Boolean).join(' · ') : t('vis_noappear');
            return `<div class="pill-tile"><div style="height:64px; display:flex; align-items:center; justify-content:center;">${pillSvg(p.shape, p.color, p.imprint, 60)}</div>
                <div style="margin-top:8px;"><b>${escapeHtml(m.name)}</b></div><div class="muted" style="font-size:.8rem;">${escapeHtml(desc)}</div></div>`;
        }).join('');
        updateVisPreview();
    }

    function renderCaregiver() {
        const cg = S.caregiver || {};
        if (!caregiverFormLoaded) {
            document.getElementById('cg-enabled').checked = !!cg.enabled;
            document.getElementById('cg-patient').value = cg.patient_name || '';
            document.getElementById('cg-name').value = cg.name || '';
            document.getElementById('cg-email').value = cg.email || '';
            document.getElementById('cg-phone').value = cg.phone || '';
            document.getElementById('cg-consent').checked = !!cg.consent;
            caregiverFormLoaded = true;
        }
        const chip = (ok, okKey, noKey) => `<span class="badge ${ok ? 'badge-ok' : 'badge-warn'}">${ok ? '✅' : '⚠️'} ${escapeHtml(t(ok ? okKey : noKey))}</span>`;
        document.getElementById('cg-status').innerHTML = chip(S.alerts.email, 'cg_email_ok', 'cg_email_no') + chip(S.alerts.sms, 'cg_sms_ok', 'cg_sms_no');
    }

    /* ====================================================================
       Actions
    ==================================================================== */
    async function toggleTaken(id) {
        try { applyState(await api('/api/medications/' + id + '/take', { method: 'POST' })); }
        catch (e) { showToast(e.message, 'error'); }
    }

    async function deleteMedication(id) {
        const med = S.meds.find(m => m.id === id);
        if (!confirm(t('confirm_delete', { name: med ? med.name : '' }))) return;
        try { applyState(await api('/api/medications/' + id, { method: 'DELETE' })); }
        catch (e) { showToast(e.message, 'error'); }
    }

    async function refillMed(id) {
        const amount = parseInt(document.getElementById('refill-' + id).value, 10);
        try {
            applyState(await api('/api/medications/' + id + '/refill', jsonOptions('POST', { amount })));
            showToast(t('refilled'), 'ok');
        } catch (e) { showToast(e.message, 'error'); }
    }

    function setThreshold(v) {
        try { localStorage.setItem('medsnap_threshold', v); } catch (e) {}
        renderSchedule();
        renderInventory();
    }

    function onSlotChange() {
        document.getElementById('med-time').value = SLOT_DEFAULT_TIME[document.getElementById('med-slot').value] || '09:00';
    }

    function updateAddPreview() {
        document.getElementById('add-preview').innerHTML = pillSvg(
            document.getElementById('med-shape').value, document.getElementById('med-color').value,
            document.getElementById('med-imprint').value, 64);
    }

    async function submitMedication(event) {
        event.preventDefault();
        const btn = document.getElementById('save-med-btn');
        btn.disabled = true;
        const payload = {
            name: document.getElementById('med-name').value.trim(),
            dosage: document.getElementById('med-dosage').value.trim(),
            slot: document.getElementById('med-slot').value,
            scheduled_time: document.getElementById('med-time').value,
            stock: parseInt(document.getElementById('med-stock').value, 10),
            daily_dose: parseInt(document.getElementById('med-daily').value, 10),
            badges: [...document.querySelectorAll('#badge-chips input:checked')].map(i => i.value),
            food_guide: document.getElementById('med-food').value.trim(),
            critical: document.getElementById('med-critical').checked,
            pill: {
                shape: document.getElementById('med-shape').value,
                color: document.getElementById('med-color').value,
                imprint: document.getElementById('med-imprint').value.trim()
            }
        };
        try {
            applyState(await api('/api/medications', jsonOptions('POST', payload)));
            showToast(t('saved'), 'ok');
            document.getElementById('add-med-form').reset();
            renderBadgeChips();
            updateAddPreview();
            switchPage('schedule-page');
        } catch (e) {
            showToast(e.message, 'error');
        } finally {
            btn.disabled = false;
        }
    }

    /* ----- label scanner ----- */
    async function handleBottleUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const box = document.getElementById('scanner-results');
        box.textContent = t('scan_scanning');
        lastScan = null;
        const formData = new FormData();
        formData.append('file', file);
        try {
            const data = await api('/api/analyze', { method: 'POST', body: formData });
            lastScan = data.parsed;
            if (data.parsed && (data.parsed.name || data.parsed.dosage)) {
                const p = data.parsed;
                box.innerHTML = `<b>${escapeHtml(t('scan_done'))}</b>
                    <div class="result-box" style="margin-top:10px;">${escapeHtml(t('f_name'))}: ${escapeHtml(p.name || t('not_found'))}
${escapeHtml(t('f_dosage'))}: ${escapeHtml(p.dosage || t('not_found'))}
${escapeHtml(t('f_slot'))}: ${escapeHtml(t(p.slot.toLowerCase()))}
${escapeHtml(t('f_directions'))}: ${escapeHtml(p.directions || t('not_found'))}</div>
                    <button class="btn" style="margin-top:12px;" onclick="fillFromScan()"><i class="fa-solid fa-wand-magic-sparkles"></i> ${escapeHtml(t('scan_use'))}</button>`;
            } else {
                box.innerHTML = `<div class="result-box">${escapeHtml(data.ocr_result || '')}</div>`;
            }
        } catch (err) {
            box.innerHTML = `<span style="color: var(--danger);">${escapeHtml(err.message)}</span>`;
        } finally {
            event.target.value = '';
        }
    }

    function fillFromScan() {
        if (!lastScan) return;
        document.getElementById('med-name').value = lastScan.name || '';
        document.getElementById('med-dosage').value = lastScan.dosage || '';
        document.getElementById('med-slot').value = lastScan.slot || 'Morning';
        onSlotChange();
        if (lastScan.directions) document.getElementById('med-food').value = lastScan.directions;
        switchPage('add-page');
        showToast(t('scan_filled'), 'ok');
    }

    /* ----- pill visualizer ----- */
    function updateVisPreview() {
        document.getElementById('vis-preview').innerHTML = pillSvg(
            document.getElementById('vis-shape').value, document.getElementById('vis-color').value,
            document.getElementById('vis-imprint').value, 96);
    }

    async function checkPill() {
        const shape = document.getElementById('vis-shape').value;
        const color = document.getElementById('vis-color').value;
        const imprint = document.getElementById('vis-imprint').value.trim();
        const out = document.getElementById('vis-result');
        if (!shape && !color && !imprint) { out.textContent = t('vis_need'); return; }
        const norm = s => String(s || '').toUpperCase().replace(/[\s-]/g, '');
        const mine = S.meds.filter(m => {
            const p = m.pill || {};
            if (!(p.shape || p.color || p.imprint)) return false;
            return (!shape || p.shape === shape) && (!color || p.color === color) && (!imprint || norm(p.imprint).includes(norm(imprint)));
        });
        let html = mine.length ? escapeHtml(t('vis_match', { names: mine.map(m => m.name + ' ' + m.dosage).join(', ') }))
            : escapeHtml(t('vis_nomatch'));
        out.style.color = mine.length ? 'var(--ink)' : 'var(--danger)';
        out.innerHTML = html;
        try {
            const data = await api('/api/identify-pill', jsonOptions('POST', { shape, color, imprint }));
            if (data.matches.length) out.innerHTML += `<div class="muted" style="font-weight:500; margin-top:6px;">${escapeHtml(t('vis_sample', { names: data.matches.join(', ') }))}</div>`;
        } catch (e) { /* sample database is optional */ }
    }

    /* ----- caregiver ----- */
    function caregiverPayload() {
        return {
            enabled: document.getElementById('cg-enabled').checked,
            patient_name: document.getElementById('cg-patient').value.trim(),
            name: document.getElementById('cg-name').value.trim(),
            email: document.getElementById('cg-email').value.trim(),
            phone: document.getElementById('cg-phone').value.trim(),
            consent: document.getElementById('cg-consent').checked
        };
    }

    async function saveCaregiver() {
        try {
            caregiverFormLoaded = false;
            applyState(await api('/api/caregiver', jsonOptions('PUT', caregiverPayload())));
            showToast(t('cg_saved'), 'ok');
        } catch (e) { caregiverFormLoaded = true; showToast(e.message, 'error'); }
    }

    async function testCaregiver() {
        try {
            caregiverFormLoaded = false;
            applyState(await api('/api/caregiver', jsonOptions('PUT', caregiverPayload())));
            await api('/api/caregiver/test', { method: 'POST' });
            showToast(t('cg_test_sent'), 'ok');
        } catch (e) { caregiverFormLoaded = true; showToast(e.message, 'error'); }
    }

    /* ----- safety checker ----- */
    async function runSafetyCheck() {
        const box = document.getElementById('safety-results');
        const btn = document.getElementById('safety-btn');
        if (!S.meds.length) { box.textContent = t('safe_need'); return; }
        btn.disabled = true;
        box.textContent = t('safe_wait');
        try {
            const data = await api('/api/interactions', jsonOptions('POST', { medications: S.meds.map(m => m.name), language: lang }));
            box.innerHTML = `<div class="result-box">${escapeHtml(data.analysis)}</div>`;
        } catch (e) {
            box.textContent = e.message;
        } finally { btn.disabled = false; }
    }

    /* ====================================================================
       Voice: read aloud (text-to-speech) and voice input
    ==================================================================== */
    function pickVoice() {
        if (!window.speechSynthesis) return null;
        const prefix = LANG_CODES[lang].slice(0, 2).toLowerCase();
        return speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith(prefix)) || null;
    }

    function speak(text) {
        if (!('speechSynthesis' in window) || !window.SpeechSynthesisUtterance) {
            showToast(t('speak_unsupported'), 'error');
            return;
        }
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = LANG_CODES[lang];
        const voice = pickVoice();
        if (voice) u.voice = voice;
        else if (speechSynthesis.getVoices().length && !warnedNoVoice) { warnedNoVoice = true; showToast(t('speak_novoice')); }
        speechSynthesis.speak(u);
    }

    function stopSpeaking() { if (window.speechSynthesis) speechSynthesis.cancel(); }

    function medSentence(m) {
        let text = t('sp_med', { name: m.name, dosage: m.dosage, slot: t(m.slot.toLowerCase()), time: m.scheduled_time });
        const badges = (m.badges || []).map(k => t('b_' + k));
        if (badges.length) text += ' ' + badges.join('. ') + '.';
        const instr = instrText(m);
        if (instr) text += ' ' + t('sp_instr', { text: instr });
        return text;
    }

    function speakMed(id) {
        const m = S.meds.find(x => x.id === id);
        if (m) speak(medSentence(m));
    }

    function speakAll() {
        if (!S.meds.length) { showToast(t('nothing_to_read')); return; }
        const sorted = [...S.meds].sort((a, b) => (a.scheduled_time || '').localeCompare(b.scheduled_time || ''));
        speak(t('sp_intro') + ' ' + sorted.map(medSentence).join(' '));
    }

    if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

    let recognition = null, listening = false;
    function toggleMic() {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const btn = document.getElementById('mic-btn');
        if (!Rec) { showToast(t('ai_mic_unsupported'), 'error'); return; }
        if (listening && recognition) { recognition.stop(); return; }
        recognition = new Rec();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = LANG_CODES[lang];
        recognition.onstart = () => { listening = true; btn.classList.add('mic-on'); };
        recognition.onresult = e => { document.getElementById('chat-input').value = e.results[0][0].transcript; };
        recognition.onerror = () => { listening = false; btn.classList.remove('mic-on'); };
        recognition.onend = () => { listening = false; btn.classList.remove('mic-on'); };
        recognition.start();
    }

    /* ====================================================================
       AI assistant chat
    ==================================================================== */
    function appendChat(sender, text) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = 'chat-msg';
        const label = sender === 'user' ? t('ai_you') : t('ai_bot');
        div.innerHTML = `<b style="color: var(--ink-soft);">${escapeHtml(label)}:</b> ${escapeHtml(text)}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
    }

    function renderChatWelcome() {
        const box = document.getElementById('chat-box');
        if (chatHistory.length === 0) {
            box.innerHTML = '';
            appendChat('assistant', t('ai_welcome'));
        }
    }

    async function sendChat() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;
        input.value = '';
        chatHistory.push({ role: 'user', content: message });
        appendChat('user', message);
        const thinking = appendChat('assistant', t('ai_thinking'));
        const btn = document.getElementById('chat-send');
        btn.disabled = true;
        try {
            const data = await api('/api/chat', jsonOptions('POST', { messages: chatHistory, language: lang, medications: S.meds.map(m => m.name) }));
            thinking.remove();
            chatHistory.push({ role: 'assistant', content: data.answer });
            appendChat('assistant', data.answer);
            if (document.getElementById('chat-autospeak').checked) speak(data.answer);
        } catch (e) {
            thinking.remove();
            chatHistory.pop();  // let the user retry the same question
            appendChat('assistant', '⚠️ ' + e.message);
        } finally { btn.disabled = false; }
    }

    /* ====================================================================
       Start
    ==================================================================== */
    (function init() {
        let saved = 'en';
        try { saved = localStorage.getItem('medsnap_lang') || 'en'; } catch (e) {}
        lang = I18N[saved] ? saved : 'en';
        document.getElementById('lang-select').value = lang;
        document.getElementById('med-time').value = SLOT_DEFAULT_TIME.Morning;
        applyStaticTranslations();
        updateAddPreview();
        refresh();
    })();
    </script>
</body>
</html>
